<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>国名アナグラム検索</title>

<style>
body{
    font-family:sans-serif;
    max-width:800px;
    margin:auto;
    padding:20px;
}

input{
    width:300px;
    padding:8px;
}

button{
    padding:8px 12px;
}

#result{
    margin-top:20px;
}
</style>
</head>
<body>

<h2>国名アナグラム検索</h2>

<input id="word" placeholder="ひらがな入力">

<button id="search">
検索
</button>

<label>
<input type="checkbox" id="shiritori">
しりとり可能のみ
</label>

<div id="result"></div>

<script>

let countryMap={};

function kataToHira(str){
    return str.replace(
        /[\u30a1-\u30f6]/g,
        s=>String.fromCharCode(
            s.charCodeAt(0)-0x60
        )
    );
}

function makeKey(str){
    return kataToHira(str)
        .replace(/ー/g,"")
        .split("")
        .sort()
        .join("");
}

async function init(){

    const countries=await fetch(
        "countries.json"
    ).then(r=>r.json());

    countries.forEach(country=>{

        const key=makeKey(country);

        if(!countryMap[key]){
            countryMap[key]=[];
        }

        countryMap[key].push(country);

    });

}

document
.getElementById("search")
.onclick=()=>{

    const word=document
        .getElementById("word")
        .value
        .trim();

    const key=makeKey(word);

    let results=
        countryMap[key]||[];

    if(
        document.getElementById("shiritori")
        .checked
    ){
        results=results.filter(
            c=>!c.endsWith("ン")
        );
    }

    document.getElementById(
        "result"
    ).innerHTML=
        results.length
        ? results.join("<br>")
        : "候補なし";

};

init();

</script>

</body>
</html>

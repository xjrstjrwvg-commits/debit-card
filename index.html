<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>国名アナグラム検索</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f6f8;
      color: #222;
    }

    h1 {
      font-size: 25px;
      text-align: center;
    }

    .panel {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 7px;
    }

    select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: white;
    }

    button {
      padding: 11px 16px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:active {
      opacity: 0.7;
    }

    .search-button {
      width: 100%;
      margin-top: 15px;
      font-size: 17px;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .result-text {
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .copy-button {
      flex-shrink: 0;
      padding: 8px 12px;
      font-size: 13px;
      background: #555;
    }

    .copy-all {
      background: #16a34a;
      margin-bottom: 12px;
    }

    #result {
      margin-top: 15px;
    }

    .count {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .hint {
      color: #777;
      font-size: 13px;
      margin-top: 7px;
    }
  </style>
</head>

<body>
  <h1>国名アナグラム検索</h1>

  <div class="panel">
    <label for="inputText">文字を入力</label>
    <input
      type="text"
      id="inputText"
      placeholder="例：アイスランド"
      autocomplete="off"
    >

    <p class="hint">
      ひらがな・カタカナのどちらでも入力できます。
    </p>

    <label for="mode" style="margin-top: 18px;">
      検索モード
    </label>

    <select id="mode">
      <option value="all">すべての組み合わせ</option>
      <option value="shiritori">しりとりになる組み合わせのみ</option>
    </select>

    <button class="search-button" id="searchButton">
      検索する
    </button>
  </div>

  <div class="panel">
    <label>検索結果</label>
    <div id="result">ここに結果が表示されます。</div>
  </div>

  <script src="dictionary.js"></script>

  <script>
    // 小さい文字を大きい文字に変換
    const smallToLarge = {
      "ぁ": "あ", "ぃ": "い", "ぅ": "う",
      "ぇ": "え", "ぉ": "お",
      "ゃ": "や", "ゅ": "ゆ", "ょ": "よ",
      "っ": "つ", "ゎ": "わ",
      "ゕ": "か", "ゖ": "け"
    };

    // 文字の正規化
    function normalize(text) {
      return Array.from(text)
        .map(ch => {
          // カタカナをひらがなに変換
          const code = ch.charCodeAt(0);

          if (code >= 0x30A1 && code <= 0x30F6) {
            ch = String.fromCharCode(code - 0x60);
          }

          // 小さい文字を大きくする
          return smallToLarge[ch] || ch;
        })
        .join("");
    }

    // 文字の出現回数を数える
    function countCharacters(text) {
      const counts = {};

      for (const ch of text) {
        counts[ch] = (counts[ch] || 0) + 1;
      }

      return counts;
    }

    // 文字列が残りの文字で作れるか確認
    function canUse(word, counts) {
      const needed = countCharacters(word);

      for (const ch in needed) {
        if ((counts[ch] || 0) < needed[ch]) {
          return false;
        }
      }

      return true;
    }

    // 文字を使用する
    function useWord(word, counts, amount) {
      for (const ch of word) {
        counts[ch] += amount;
      }
    }

    // すべての組み合わせを検索
    function findCombinations(input) {
      const target = normalize(input);
      const targetCounts = countCharacters(target);

      const countries = [...new Set(
        (window.COUNTRY_NAMES || []).map(normalize)
      )];

      const results = [];

      function dfs(start, remaining, chosen) {
        if (remaining === 0) {
          results.push([...chosen]);
          return;
        }

        for (let i = start; i < countries.length; i++) {
          const word = countries[i];

          if (!canUse(word, remaining)) {
            continue;
          }

          useWord(word, remaining, -1);
          chosen.push(word);

          dfs(i + 1, remaining, chosen);

          chosen.pop();
          useWord(word, remaining, 1);
        }
      }

      dfs(0, targetCounts, []);

      return results;
    }

    // しりとりになる順番を検索
    function findShiritoriOrder(words) {
      if (words.length <= 1) {
        return [...words];
      }

      function dfs(remaining, chain) {
        if (remaining.length === 0) {
          return chain;
        }

        const last = chain[chain.length - 1];
        const lastChar = Array.from(last).pop();

        if (lastChar === "ー") {
          return null;
        }

        for (let i = 0; i < remaining.length; i++) {
          const next = remaining[i];

          if (lastChar !== Array.from(next)[0]) {
            continue;
          }

          const rest = remaining.filter((_, index) => index !== i);
          const result = dfs(rest, [...chain, next]);

          if (result) {
            return result;
          }
        }

        return null;
      }

      for (let i = 0; i < words.length; i++) {
        const first = words[i];
        const rest = words.filter((_, index) => index !== i);

        const result = dfs(rest, [first]);

        if (result) {
          return result;
        }
      }

      return null;
    }

    // 検索結果の表示
    function displayResults(results) {
      const resultArea = document.getElementById("result");

      if (results.length === 0) {
        resultArea.textContent = "解なし";
        return;
      }

      const count = document.createElement("div");
      count.className = "count";
      count.textContent = `${results.length}件`;

      const copyAll = document.createElement("button");
      copyAll.className = "copy-all";
      copyAll.textContent = "すべてコピー";

      copyAll.addEventListener("click", () => {
        copyText(results.map(words => words.join(" ")).join("\n"));
      });

      resultArea.replaceChildren(count, copyAll);

      results.forEach(words => {
        const item = document.createElement("div");
        item.className = "result-item";

        const text = document.createElement("span");
        text.className = "result-text";
        text.textContent = words.join(" ");

        const button = document.createElement("button");
        button.className = "copy-button";
        button.textContent = "コピー";

        button.addEventListener("click", () => {
          copyText(words.join(" "));
        });

        item.append(text, button);
        resultArea.appendChild(item);
      });
    }

    // コピー処理
    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        alert("コピーしました！");
      } catch (error) {
        alert("コピーできませんでした。");
      }
    }

    // 検索実行
    function search() {
      const input = document.getElementById("inputText").value.trim();
      const mode = document.getElementById("mode").value;

      if (!input) {
        alert("文字を入力してください。");
        return;
      }

      if (!window.COUNTRY_NAMES) {
        document.getElementById("result").textContent =
          "dictionary.jsを読み込めませんでした。";
        return;
      }

      const combinations = findCombinations(input);
      let results = combinations;

      if (mode === "shiritori") {
        results = [];

        for (const words of combinations) {
          const ordered = findShiritoriOrder(words);

          if (ordered) {
            results.push(ordered);
          }
        }
      }

      displayResults(results);
    }

    document
      .getElementById("searchButton")
      .addEventListener("click", search);

    document
      .getElementById("inputText")
      .addEventListener("keydown", event => {
        if (event.key === "Enter") {
          search();
        }
      });
  </script>
</body>
</html>
